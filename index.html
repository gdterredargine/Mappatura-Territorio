            L.marker([44.73263210229508, 10.920982669127579], ARCIOptions).bindPopup(

            L.marker([44.729374348429396, 10.921034445511497], ARCIOptions).bindPopup(

            L.marker([44.794697747539466, 10.968355924949384], ARCIOptions).bindPopup(

            L.marker([44.747760466428865, 10.97909576727359], ARCIOptions).bindPopup(

            // Centri ANCESCAO:

                iconSize: [30, 30]
            }
            
            let ANCESCAOOptions = {
                title:"ANCESCAO",
                icon: L.icon(ANCESCAOIcon)
            }

            var groupANCESCAO = L.layerGroup();
            
            L.marker([44.78847168058613, 10.885572390055147], ANCESCAOOptions).bindPopup(
                "<b>Centro Bruno Losi</b> <br> <span style='font-size:20px;'>&#8641;</span> <a href='https://ancescao.modena.it/chi-siamo/centri'>Scopri di piu'!</a>", customOptions).addTo(groupANCESCAO);
            L.marker([44.76848157447455, 10.890472637821087], ANCESCAOOptions).bindPopup(
                "<b>Centro Graziosi</b> <br> <span style='font-size:20px;'>&#8641;</span> <a href='https://ancescao.modena.it/chi-siamo/centri'>Scopri di piu'!</a>", customOptions).addTo(groupANCESCAO);
            L.marker([44.79355080780919, 10.892621683966363], ANCESCAOOptions).bindPopup(
                "<b>Circolo Cibeno Pile</b> <br> <span style='font-size:20px;'>&#8641;</span> <a href='https://ancescao.modena.it/chi-siamo/centri'>Scopri di piu'!</a>", customOptions).addTo(groupANCESCAO);
            L.marker([44.79410920318989, 10.876515457495607], ANCESCAOOptions).bindPopup(
                "<b>Circolo Guerzoni</b> <br> <span style='font-size:20px;'>&#8641;</span> <a href='https://ancescao.modena.it/chi-siamo/centri'>Scopri di piu'!</a>", customOptions).addTo(groupANCESCAO);
            L.marker([44.76771205102637, 10.867486065419934], ANCESCAOOptions).bindPopup(
                "<b>Centro Gorizia</b> <br> <span style='font-size:20px;'>&#8641;</span> <a href='https://ancescao.modena.it/chi-siamo/centri'>Scopri di piu'!</a>", customOptions).addTo(groupANCESCAO);
            L.marker([44.781183755147296, 10.87341429796707], ANCESCAOOptions).bindPopup(
                "<b>Centro Orti</b> <br> <span style='font-size:20px;'>&#8641;</span> <a href='https://ancescao.modena.it/chi-siamo/centri'>Scopri di piu'!</a>", customOptions).addTo(groupANCESCAO);
            L.marker([44.690721752995785, 10.842646236578652], ANCESCAOOptions).bindPopup(
                "<b>Centro La Quercia</b> <br> <span style='font-size:20px;'>&#8641;</span> <a href='https://ancescao.modena.it/chi-siamo/centri'>Scopri di piu'!</a>", customOptions).addTo(groupANCESCAO);


            // Cinema:

            let CinemaIcon = {
                iconUrl: "imgs/cinema.png",
                iconSize: [30, 30]
            }
            
            let CinemaOptions = {
                title:"Cinema",
                icon: L.icon(CinemaIcon)
            }

            var groupCinema = L.layerGroup();

            L.marker([44.78636253999379, 10.88293328331409], CinemaOptions).bindPopup(
                "<b>Cinema Corso</b> <br> <span style='font-size:20px;'>&#8641;</span> <a href='https://www.cinemacorsocarpi.it'>Visita il sito!</a>", customOptions).addTo(groupCinema);
            L.marker([44.786161429622965, 10.863802991868077], CinemaOptions).bindPopup(
                "<b>Space City</b> <br> <span style='font-size:20px;'>&#8641;</span> <a href='https://www.spacecity.it'>Visita il sito!</a>", customOptions).addTo(groupCinema);
            L.marker([44.787745264177104, 10.884402357788051], CinemaOptions).bindPopup(
                "<b>Cinema Eden</b> <br> <span style='font-size:20px;'>&#8641;</span> <a href='https://www.cinemaedencarpi.it'>Visita il sito!</a>", customOptions).addTo(groupCinema);
            L.marker([44.80909862164102, 10.913088507209773], CinemaOptions).bindPopup(
                "<b>Cinema Ariston</b> <br> <span style='font-size:20px;'>&#8641;</span> <a href='https://www.aristoncinemacarpi.it'>Visita il sito!</a>", customOptions).addTo(groupCinema);
            L.marker([44.78440767745846, 10.873193193273792], CinemaOptions).bindPopup(
                "<b>Cinema Estivo Eden</b>", customOptions).addTo(groupCinema);
            L.marker([44.78684440203163, 10.888471056331108], CinemaOptions).bindPopup(

            L.marker([44.73833183911224, 10.923864540291525], CinemaOptions).bindPopup(
                "<b>Cinema Italia</b> <br> <span style='font-size:20px;'>&#8641;</span> <a href='https://www.arcimodena.org/notizie/1253/nuovo-cinema-italia-di-soliera.html'>Novita'</a>", customOptions).addTo(groupCinema);

            }

            }

            // Biblioteche:

            let BibliotecaIcon = {
                iconUrl: "imgs/bookshelf.png",
                iconSize: [30, 30]
            }

                icon: L.icon(BibliotecaIcon)
            }

            L.marker([44.688197954958426, 10.840403953779134], BibliotecaOptions).bindPopup('Biblioteca Campori Junior', customOptions).addTo(groupBiblioteca);


             // Trasporto pubblico:

            iconUrl: "imgs/marker-train-bus.png",
            iconSize: [30, 30]
            }
            
            let PubTranspOptions = {
                title:"Trasporto Pubblico",
                icon: L.icon(PubTranspIcon)
            }

            var groupPubTransp = L.layerGroup();

            L.marker([44.782908879412496, 10.891780969308371], PubTranspOptions).bindPopup(
                "<b> Stazione FS</b> <br> <span style='font-size:20px;'>&#8641;</span> <a href='https://www.rfi.it/it/stazioni/carpi.html'>Pagina</a>", customOptions).addTo(groupPubTransp);
            

            // Servizi:

            let BuildingIcon = {
                iconUrl: "imgs/marker-building.png",
                iconSize: [30, 30]
            }
            
            let BuildingOptions = {
                title:"Building",
                icon: L.icon(BuildingIcon)
            }
            
            var groupBuilding = L.layerGroup();

            L.marker([44.782685340911414, 10.875888866038123], BuildingOptions).bindPopup(
                "<b>Consultorio</b> <br> <span style='font-size:20px;'>&#8641;</span> <a href='https://www.ausl.mo.it/luogo/consultorio-familiare-spazio-giovani-e-giovani-adulti-carpi/'>Visita</a>", customOptions).addTo(groupBuilding);

            
            // Gestione azioni cliccando i bottoni di filtro:

            var filters = {
            "ARCI": groupARCI,
            "ANCESCAO": groupANCESCAO,
            "Cinema": groupCinema,
            "Teatro": groupTeatro,
            "Biblioteche": groupBiblioteca,
            "Mezzi Pubblici": groupPubTransp,
            "Servizi": groupBuilding
            };

            // Aggiunge tutti i gruppi alla mappa all'accensione
            Object.values(filters).forEach(layer => layer.addTo(map));

            // Seleziona tutti i bottoni con classe filter
            document.querySelectorAll('button.filter').forEach(button => {
                button.addEventListener('click', function(e) {                    
                    var categoria = this.textContent;

                    if (categoria === "Mostra Tutto") {
                        // Tutti i gruppi aggiunti alla mappa
                        Object.values(filters).forEach(layer => map.addLayer(layer));
                    } else {
                        // Tutto rimosso prima di mostrare solo la categoria scelta
                        Object.values(filters).forEach(layer => map.removeLayer(layer));
                        
                        // Se esiste il gruppo corrispondente, mostralo
                        if (filters[categoria]) {
                            map.addLayer(filters[categoria]);
                        }
                    }
                });
            });

            document.querySelector('select.filter').addEventListener('change', function() {
                var categoria = this.value;
                
                Object.values(filters).forEach(layer => map.removeLayer(layer));
                if (filters[categoria]) {
                    map.addLayer(filters[categoria]);
                }
            });
        </script>
