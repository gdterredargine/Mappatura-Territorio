<!DOCTYPE html>
<html>
    <head>
        <title>Mappatura Territorio Terre d'Argine</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
        <link rel="icon" href="imgs/gd_logo.ico" type="image/x-icon">
        <link rel="stylesheet" href="style.css" type="text/css"/>
        <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    </head>
    
    <body>
        <h1>Terre d'Argine</h1>

        <section>
            <div id="filters">
                <button class="filter">Mostra Tutto</button>
                <select class="filter">
                    <option value="Circoli Sociali" selected>Circoli Sociali</option>
                    <option value="ARCI">ARCI</option>
                    <option value="ANCESCAO">ANCESCAO</option>
                </select>
                <button class="filter">Cinema</button>
                <button class="filter">Teatro</button>
                <button class="filter">Mezzi Pubblici [WIP]</button>
                <button class="filter">Servizi [WIP]</button>
                <button class="filter">Parchi [WIP]</button> 
                <button class="filter">Biblioteche [WIP]</button>               
            </div>

            <div id="map"></div>
        </section>

        
        <script referrerpolicy="strict-origin-when-cross-origin">
            // 1. Inizializzazione Mappa
            var map = L.map('map').setView([44.783, 10.883], 12);
            L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
            }).addTo(map);

            var customOptions = { 'className': 'custom' };

            // Bounding Box delle Terre d'Argine [Sud, Ovest, Nord, Est]
            const BBOX = "44.65,10.80,44.92,11.02";

            // 2. Definizione dei Gruppi e delle Icone
            const groups = {
                "ARCI": L.layerGroup().addTo(map),
                "ANCESCAO": L.layerGroup().addTo(map),
                "Cinema": L.layerGroup().addTo(map),
                "Teatro": L.layerGroup().addTo(map),
                "Biblioteche": L.layerGroup().addTo(map),
                "Mezzi Pubblici": L.layerGroup().addTo(map),
                "Servizi": L.layerGroup().addTo(map)
            };

            const icons = {
                "ARCI": L.icon({ iconUrl: "imgs/arci.png", iconSize: [30, 30] }),
                "ANCESCAO": L.icon({ iconUrl: "imgs/ancescao.png", iconSize: [30, 30] }),
                "Cinema": L.icon({ iconUrl: "imgs/cinema.png", iconSize: [30, 30] }),
                "Teatro": L.icon({ iconUrl: "imgs/drama-masks.png", iconSize: [30, 30] }),
                "Biblioteche": L.icon({ iconUrl: "imgs/bookshelf.png", iconSize: [30, 30] }),
                "Mezzi Pubblici": L.icon({ iconUrl: "imgs/marker-train-bus.png", iconSize: [30, 30] }),
                "Servizi": L.icon({ iconUrl: "imgs/marker-building.png", iconSize: [30, 30] })
            };

            // 3. Singola richiesta combinata per evitare il blocco del rate-limit
            async function caricaDatiMappa() {
                const combinedQuery = `
                    [out:json][timeout:25];
                    (
                    node["amenity"~"cinema|theatre|library|clinic|social_facility|townhall|bus_station"](${BBOX});
                    way["amenity"~"cinema|theatre|library|clinic|social_facility|townhall|bus_station"](${BBOX});
                    node["railway"="station"](${BBOX});
                    node["name"~"ARCI|ANCESCAO",i](${BBOX});
                    way["name"~"ARCI|ANCESCAO",i](${BBOX});
                    );
                    out center;
                `;

                // Server principale con fallback su server mirror
                const endpoints = [
                    'https://overpass-api.de/api/interpreter',
                    'https://overpass.kumi.systems/api/interpreter'
                ];

                let data = null;

                for (const endpoint of endpoints) {
                    try {
                        const response = await fetch(endpoint, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                            body: 'data=' + encodeURIComponent(combinedQuery)
                        });
                        if (response.ok) {
                            data = await response.json();
                            break;
                        }
                    } catch (err) {
                        console.warn(`Endpoint ${endpoint} non raggiungibile, tentativo con mirror alternativo...`);
                    }
                }

                if (!data || !data.elements) {
                    console.error("Errore nel recupero dati da Overpass API.");
                    return;
                }

                // 4. Classificazione ed inserimento dei marker sulla mappa
                data.elements.forEach(element => {
                    const lat = element.lat || (element.center && element.center.lat);
                    const lon = element.lon || (element.center && element.center.lon);
                    if (!lat || !lon) return;

                    const tags = element.tags || {};
                    const name = tags.name || "";
                    const amenity = tags.amenity || "";
                    const railway = tags.railway || "";

                    let targetCategory = null;

                    // Smistamento basato sui tag presenti
                    if (/ARCI/i.test(name)) targetCategory = "ARCI";
                    else if (/ANCESCAO/i.test(name)) targetCategory = "ANCESCAO";
                    else if (amenity === "cinema") targetCategory = "Cinema";
                    else if (amenity === "theatre") targetCategory = "Teatro";
                    else if (amenity === "library") targetCategory = "Biblioteche";
                    else if (railway === "station" || amenity === "bus_station") targetCategory = "Mezzi Pubblici";
                    else if (["clinic", "social_facility", "townhall"].includes(amenity)) targetCategory = "Servizi";

                    if (targetCategory && groups[targetCategory]) {
                        const via = tags['addr:street'] ? `${tags['addr:street']} ${tags['addr:housenumber'] || ''}` : '';
                        const citta = tags['addr:city'] || '';
                        const indirizzo = [via, citta].filter(Boolean).join(', ');
                        const website = tags.website || tags['contact:website'];

                        let popupContent = `<b>${name || targetCategory}</b>`;
                        if (indirizzo) popupContent += `<br>${indirizzo}`;
                        if (website) popupContent += `<br><span style='font-size:18px;'>&#8641;</span> <a href='${website}' target='_blank'>Visita il sito</a>`;

                        L.marker([lat, lon], { title: targetCategory, icon: icons[targetCategory] })
                            .bindPopup(popupContent, customOptions)
                            .addTo(groups[targetCategory]);
                    }
                });
            }

            // Avvio caricamento dati
            caricaDatiMappa();

            // 5. Gestione dei filtri (pulsanti e select)
            document.querySelectorAll('button.filter').forEach(button => {
                button.addEventListener('click', function() {                    
                    var categoria = this.textContent.trim();
                    if (categoria === "Mostra Tutto") {
                        Object.values(groups).forEach(layer => map.addLayer(layer));
                    } else {
                        Object.values(groups).forEach(layer => map.removeLayer(layer));
                        if (groups[categoria]) {
                            map.addLayer(groups[categoria]);
                        }
                    }
                });
            });

            document.querySelector('select.filter').addEventListener('change', function() {
                var categoria = this.value;
                Object.values(groups).forEach(layer => map.removeLayer(layer));
                if (groups[categoria]) {
                    map.addLayer(groups[categoria]);
                }
            });
        </script>

        
        <section id="gallery">
            <img class="gallery" src="imgs/piazza_carpi.png" alt="Piazza Carpi">
            <img class="gallery" src="imgs/piazza_soliera.png" alt="Piazza Soliera">
            <img class="gallery" src="imgs/piazza_novi.png" alt="Piazza Novi">
            <img class="gallery" src="imgs/piazza_campogalliano.png" alt="Piazza Campogalliano">
        </section>

        <hr>

        <div class="Instagram-feed-widget" style="max-width: 100%; text-align: center;">
            <iframe 
                src="https://www.Instagram.com/gd_terredargine/embed" 

                onload="this.width=screen.width * 0.85; this.height=screen.width * 0.45"
                frameborder="0" 
                scrolling="yes" 
                allowtransparency="true" 

                style="border: 1px;
                        overflow: hidden;
                        margin: 2vw;
                        border-radius:1vw;
                        transform: scale(0.90, 0.90); ">
            </iframe>
        </div>

        <hr>

        <div class="scrolls">
            <a href="https://support.ecosia.org" target="_blank">
                <div class="container">
                    <img class="redirect" src="imgs/ecosia.png" alt="Ecosia">
                    <div class="overlay"></div>
                </div>
            </a>   
            <a href="https://www.toogoodtogo.com/it/how-does-the-app-work" target="_blank">
                <div class="container">
                    <img class="redirect" src="imgs/toogoodtogo.png" alt="Too Good To Go">
                    <div class="overlay"></div>
                </div>
            </a>
            <a href="https://company.vinted.com/sustainability?lang=it" target="_blank">
                <div class="container">
                    <img class="redirect" src="imgs/vinted.png" alt="Vinted">
                    <div class="overlay"></div>
                </div>
            </a>   
        </div>

        <!-- Fine pagina -->

        <footer>
            <a href="https://www.instagram.com/gd_terredargine/"><img class="png" src="imgs/instagram.png" alt="Instagram"></a>
            <a href="https://www.facebook.com/Gdcarpi/?locale=it_IT"><img class="png" src="imgs/facebook.png" alt="Facebook"></a>
        </footer>
    </body>
</html>
