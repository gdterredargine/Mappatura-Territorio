<!DOCTYPE html>
<html>
    <head>
        <title>Mappatura Territorio Terre d'Argine</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
        <link rel="icon" href="imgs/gd_logo.ico" type="image/x-icon">
        <link rel="stylesheet" href="style.css" type="text/css"/>
        <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    </head>
    
    <body>
        <h1>Terre d'Argine</h1>

        <section>
            <div id="filters">
                <button class="filter">Mostra Tutto</button>
                <select class="filter">
                    <option value="Circoli Sociali" selected>Circoli Sociali</option>
                    <option value="ARCI">ARCI</option>
                    <option value="ANCESCAO">ANCESCAO</option>
                </select>
                <button class="filter">Cinema</button>
                <button class="filter">Teatro</button>
                <button class="filter">Mezzi Pubblici [WIP]</button>
                <button class="filter">Servizi [WIP]</button>
                <button class="filter">Parchi [WIP]</button> 
                <button class="filter">Biblioteche [WIP]</button>               
            </div>

            <div id="map"></div>
        </section>

        
        <script referrerpolicy="strict-origin-when-cross-origin">
            // Inizializzazione Mappa
            var map = L.map('map').setView([44.783, 10.883], 12);
            L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
            }).addTo(map);

            var customOptions = { 'className': 'custom' };

            // Bounding Box delle Terre d'Argine [Sud, Ovest, Nord, Est] (Carpi, Soliera, Novi, Campogalliano)
            const BBOX = "44.65,10.80,44.92,11.02";

            // Definizione Gruppi di Livelli e Icone
            const categorieConfig = {
                "ARCI": {
                    layer: L.layerGroup().addTo(map),
                    options: { title: "ARCI", icon: L.icon({ iconUrl: "imgs/arci.png", iconSize: [30, 30] }) },
                    query: `node["name"~"ARCI",i](${BBOX}); way["name"~"ARCI",i](${BBOX});`
                },
                "ANCESCAO": {
                    layer: L.layerGroup().addTo(map),
                    options: { title: "ANCESCAO", icon: L.icon({ iconUrl: "imgs/ancescao.png", iconSize: [30, 30] }) },
                    query: `node["name"~"ANCESCAO",i](${BBOX}); way["name"~"ANCESCAO",i](${BBOX});`
                },
                "Cinema": {
                    layer: L.layerGroup().addTo(map),
                    options: { title: "Cinema", icon: L.icon({ iconUrl: "imgs/cinema.png", iconSize: [30, 30] }) },
                    query: `node["amenity"="cinema"](${BBOX}); way["amenity"="cinema"](${BBOX});`
                },
                "Teatro": {
                    layer: L.layerGroup().addTo(map),
                    options: { title: "Teatro", icon: L.icon({ iconUrl: "imgs/drama-masks.png", iconSize: [30, 30] }) },
                    query: `node["amenity"="theatre"](${BBOX}); way["amenity"="theatre"](${BBOX});`
                },
                "Biblioteche": {
                    layer: L.layerGroup().addTo(map),
                    options: { title: "Biblioteca", icon: L.icon({ iconUrl: "imgs/bookshelf.png", iconSize: [30, 30] }) },
                    query: `node["amenity"="library"](${BBOX}); way["amenity"="library"](${BBOX});`
                },
                "Mezzi Pubblici": {
                    layer: L.layerGroup().addTo(map),
                    options: { title: "Trasporto Pubblico", icon: L.icon({ iconUrl: "imgs/marker-train-bus.png", iconSize: [30, 30] }) },
                    query: `node["railway"="station"](${BBOX}); node["amenity"="bus_station"](${BBOX});`
                },
                "Servizi": {
                    layer: L.layerGroup().addTo(map),
                    options: { title: "Servizio", icon: L.icon({ iconUrl: "imgs/marker-building.png", iconSize: [30, 30] }) },
                    query: `node["amenity"~"clinic|social_facility|townhall"](${BBOX}); way["amenity"~"clinic|social_facility|townhall"](${BBOX});`
                }
            };

            // Funzione di caricamento generica tramite Overpass API
            async function caricaDatiCategoria(catKey) {
                const config = categorieConfig[catKey];
                if (!config) return;

                const overpassQuery = `
                    [out:json][timeout:25];
                    (
                    ${config.query}
                    );
                    out center;
                `;

                try {
                    const response = await fetch('https://overpass-api.de/api/interpreter', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                        body: 'data=' + encodeURIComponent(overpassQuery)
                    });
                    const data = await response.json();

                    data.elements.forEach(element => {
                        // Gestisce sia punti singoli (node) che perimetri/edifici (way)
                        const lat = element.lat || (element.center && element.center.lat);
                        const lon = element.lon || (element.center && element.center.lon);

                        if (!lat || !lon) return;

                        const nome = element.tags.name || config.options.title;
                        const via = element.tags['addr:street'] ? `${element.tags['addr:street']} ${element.tags['addr:housenumber'] || ''}` : '';
                        const citta = element.tags['addr:city'] || '';
                        const indirizzoCompleto = [via, citta].filter(Boolean).join(', ');
                        const sitoWeb = element.tags.website || element.tags['contact:website'];

                        let popupContent = `<b>${nome}</b>`;
                        if (indirizzoCompleto) popupContent += `<br>${indirizzoCompleto}`;
                        if (sitoWeb) popupContent += `<br><span style='font-size:18px;'>&#8641;</span> <a href='${sitoWeb}' target='_blank'>Visita il sito</a>`;

                        L.marker([lat, lon], config.options)
                            .bindPopup(popupContent, customOptions)
                            .addTo(config.layer);
                    });
                } catch (error) {
                    console.error(`Errore nel caricamento della categoria ${catKey}:`, error);
                }
            }

            // Caricamento di tutte le categorie all'avvio
            Object.keys(categorieConfig).forEach(categoria => {
                caricaDatiCategoria(categoria);
            });

            // Gestione dei filtri (pulsanti e select)
            const filters = Object.fromEntries(
                Object.entries(categorieConfig).map(([key, value]) => [key, value.layer])
            );

            document.querySelectorAll('button.filter').forEach(button => {
                button.addEventListener('click', function() {                    
                    var categoria = this.textContent.trim();

                    if (categoria === "Mostra Tutto") {
                        Object.values(filters).forEach(layer => map.addLayer(layer));
                    } else {
                        Object.values(filters).forEach(layer => map.removeLayer(layer));
                        if (filters[categoria]) {
                            map.addLayer(filters[categoria]);
                        }
                    }
                });
            });

            document.querySelector('select.filter').addEventListener('change', function() {
                var categoria = this.value;
                Object.values(filters).forEach(layer => map.removeLayer(layer));
                if (filters[categoria]) {
                    map.addLayer(filters[categoria]);
                }
            });
        </script>

        
        <section id="gallery">
            <img class="gallery" src="imgs/piazza_carpi.png" alt="Piazza Carpi">
            <img class="gallery" src="imgs/piazza_soliera.png" alt="Piazza Soliera">
            <img class="gallery" src="imgs/piazza_novi.png" alt="Piazza Novi">
            <img class="gallery" src="imgs/piazza_campogalliano.png" alt="Piazza Campogalliano">
        </section>

        <hr>

        <div class="Instagram-feed-widget" style="max-width: 100%; text-align: center;">
            <iframe 
                src="https://www.Instagram.com/gd_terredargine/embed" 

                onload="this.width=screen.width * 0.85; this.height=screen.width * 0.45"
                frameborder="0" 
                scrolling="yes" 
                allowtransparency="true" 

                style="border: 1px;
                        overflow: hidden;
                        margin: 2vw;
                        border-radius:1vw;
                        transform: scale(0.90, 0.90); ">
            </iframe>
        </div>

        <hr>

        <div class="scrolls">
            <a href="https://support.ecosia.org" target="_blank">
                <div class="container">
                    <img class="redirect" src="imgs/ecosia.png" alt="Ecosia">
                    <div class="overlay"></div>
                </div>
            </a>   
            <a href="https://www.toogoodtogo.com/it/how-does-the-app-work" target="_blank">
                <div class="container">
                    <img class="redirect" src="imgs/toogoodtogo.png" alt="Too Good To Go">
                    <div class="overlay"></div>
                </div>
            </a>
            <a href="https://company.vinted.com/sustainability?lang=it" target="_blank">
                <div class="container">
                    <img class="redirect" src="imgs/vinted.png" alt="Vinted">
                    <div class="overlay"></div>
                </div>
            </a>   
        </div>

        <!-- Fine pagina -->

        <footer>
            <a href="https://www.instagram.com/gd_terredargine/"><img class="png" src="imgs/instagram.png" alt="Instagram"></a>
            <a href="https://www.facebook.com/Gdcarpi/?locale=it_IT"><img class="png" src="imgs/facebook.png" alt="Facebook"></a>
        </footer>
    </body>
</html>
